<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Il Museo del Silenzio</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3efe6;--fg:#2a2118;--card:#fffaf0;--ac:#b4532a;--ok:#2e7d4f;--ko:#b3261e;--mut:#7a6a58;--line:#d9ccb4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1812;--fg:#f1e8d8;--card:#2a241a;--ac:#e08a5c;--ok:#6fcf97;--ko:#ff8a80;--mut:#b5a58e;--line:#4a3f2e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1812;--fg:#f1e8d8;--card:#2a241a;--ac:#e08a5c;--ok:#6fcf97;--ko:#ff8a80;--mut:#b5a58e;--line:#4a3f2e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.55 Georgia,"Times New Roman",serif}
main{max-width:780px;margin:0 auto;padding:16px}
h1,h2{font-family:"Trebuchet MS",Verdana,sans-serif;line-height:1.2;margin:.3em 0}
h1{font-size:2.2rem}h2{font-size:1.5rem}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:Verdana,sans-serif;font-size:.85rem;color:var(--mut);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px;flex-wrap:wrap}
.let{display:inline-block;min-width:1.6em;text-align:center;border:1px solid var(--line);border-radius:6px;margin-left:3px;color:var(--ac);font-weight:bold}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
.ph{width:100%;aspect-ratio:16/9;border:2px dashed var(--ac);border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;color:var(--mut);font:.85rem Verdana,sans-serif}
img.pic{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;display:block}
.eco{width:96px;float:left;margin:0 12px 4px 0}.eco .ph{aspect-ratio:1/1;font-size:.7rem;padding:4px}.eco img{aspect-ratio:1/1}
.it{margin:12px 0;padding:8px;border-left:4px solid var(--line)}
.it.ok{border-color:var(--ok)}.it.ko{border-color:var(--ko)}
select,input{font:inherit;width:100%;padding:8px;margin-top:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
button{font:bold 1rem Verdana,sans-serif;padding:10px 16px;border:0;border-radius:8px;background:var(--ac);color:#fff;cursor:pointer;margin:4px 4px 4px 0}
button.b2{background:transparent;color:var(--ac);border:1px solid var(--ac);padding:6px 10px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.msg{font-family:Verdana,sans-serif;font-size:.95rem;margin:8px 0}
.hint{background:var(--bg);border:1px dashed var(--ac);padding:8px;border-radius:6px;margin:6px 0;font-size:.95rem}
.big{font-size:3rem;letter-spacing:.2em;text-align:center;color:var(--ac);font-family:Verdana,sans-serif}
</style>
</head>

const nz=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
function bar(){const m=Math.floor(Math.abs(sec)/60),s=Math.abs(sec)%60;
 return `<div class="bar"><span>Stanza ${cur+1} di 6</span><span>${sec<0?"Tempo extra ":"Tempo "}${m}:${String(s).padStart(2,"0")}</span><span>Indizi: ${hints}</span><span>Lettere:${got.map(l=>`<span class="let">${l}</span>`).join("")||" –"}</span></div>`}
function tick(){sec--;const b=$(".bar");if(b)b.outerHTML=bar()}
function eco(t){return `<div class="card"><div class="eco">${img("eco")}</div><p>${t}</p><div style="clear:both"></div></div>`}
function home(){$("#app").innerHTML=`${img("museo")}<h1>Il Museo del Silenzio</h1>
<p>Una notte il Museo della Musica si risveglia, ma una nebbia grigia, il <b>Silenzio</b>, ha inghiottito ogni suono. Voi siete gli <b>Apprendisti Ascoltatori</b>.</p>
${eco("Sono Eco, un vecchio rombo di legno. Ti porto alle origini della musica: recupera 6 Note-Chiave. Ognuna nasconde una lettera. Insieme formano la parola che spezza l’incantesimo. Avete 45 minuti!")}
<button onclick="go()">Inizia l’avventura</button>`}
function go(){try{ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}tm=setInterval(tick,1000);room()}
function room(){const r=R[cur];hs=0;
 let h=bar()+`<h2>${r.t}</h2>${img(r.k)}${eco(r.intro)}<div class="card">`;
 r.it.forEach((x,i)=>{const o=Array.isArray(x[2])?x[2]:r.o;const txt=x[2]==="t"||x[2]===1;
  h+=`<div class="it" id="i${i}"><div>${x[0]}${typeof x[2]==="number"&&x[2]!==1?` <button class="b2" onclick="play(${x[2]})">▶ Ascolta</button>`:""}</div>`;
  h+=txt?`<input type="text" autocomplete="off" aria-label="Risposta">`:`<select aria-label="Scelta"><option value="">— scegli —</option>${[...o].sort((a,b)=>a.localeCompare(b,"it")).map(v=>`<option>${v}</option>`).join("")}</select>`;
  h+=`</div>`});
 h+=`<button onclick="check()">Verifica</button><button class="b2" onclick="hint()">Chiedi un indizio</button><div id="hn"></div><div class="msg" id="ms"></div></div>`;
 $("#app").innerHTML=h;scrollTo(0,0)}
function hint(){const r=R[cur];if(hs>=2)return;hints++;
 $("#hn").insertAdjacentHTML("beforeend",`<div class="hint">${hs?"Aiuto forte: ":"Suggerimento: "}${r.h[hs]}</div>`);hs++;$(".bar").outerHTML=bar()}
function check(){const r=R[cur];let all=true;
 r.it.forEach((x,i)=>{const e=$("#i"+i),v=e.querySelector("select,input").value;const ok=nz(v)===nz(x[1]);if(!ok)all=false;e.className="it "+(ok?"ok":"ko")});
 const m=$("#ms");
 if(!all){m.textContent="Non ancora: le risposte con il bordo rosso sono da rivedere. Riprova o chiedi un indizio.";return}
 got.push(r.L);$(".bar").outerHTML=bar();
 m.innerHTML=`Stanza superata! Hai ottenuto la Nota-Chiave con la lettera <span class="let" style="font-size:1.4rem">${r.L}</span><br><button onclick="next()">${cur<5?"Vai alla stanza successiva":"Apri la porta"}</button>`}
function next(){cur++;cur<R.length?room():end()}
function end(){clearInterval(tm);const m=Math.floor((2700-sec)/60);
 $("#app").innerHTML=`${img("museo")}<div class="big">MUSICA</div><h2 style="text-align:center">Il Silenzio è spezzato!</h2>
 <p>Gli strumenti tornano a suonare e il museo riapre prima dell’alba. Avete impiegato circa ${m} minuti e usato ${hints} indizi.</p>
 ${eco("Grazie, Apprendisti Ascoltatori! Ogni suono nasce da una vibrazione: ricordatelo sempre.")}`}
function tone(t,f,d,type,v){if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain(),n=ctx.currentTime+t;
 o.type=type;o.frequency.setValueAtTime(f,n);if(type==="sine")o.frequency.exponentialRampToValueAtTime(50,n+d);
 g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(ctx.destination);o.start(n);o.stop(n+d)}
function play(k){if(!ctx)return;if(ctx.state==="suspended")ctx.resume();
 const dr=t=>tone(t,140,.4,"sine",.9);
 if(k===0){dr(0);dr(1)}else if(k===1){dr(0);dr(.25);dr(.5)}else{tone(0,196,1.6,"sawtooth",.25);tone(0,98,1.6,"sawtooth",.2)}}
home();
</script>
</body>
</html>
